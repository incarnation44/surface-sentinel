# 패키지 메타데이터, 의존성(uv), CLI 진입점, pytest 마커, ruff 린트 규칙 정의.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "surface-sentinel"
version = "1.0.1"
description = "Deterministic surface-defect inspection and verification system for KolektorSDD2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Surface Sentinel contributors" }]
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.scripts]
surface-sentinel = "surface_sentinel.cli:main"

[project.optional-dependencies]
# 제품 추론용(ONNX Runtime). 학습 의존성(ultralytics/torch)은 .venv-train 에만 둔다.
yolo = ["onnxruntime>=1.17"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "httpx2>=2.16,<3",
  "ruff>=0.6,<1",
  "playwright>=1.45,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/surface_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "data: requires the local KSDD2 dataset",
  "browser: requires a local Chrome installation",
  "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
