# [실험 스냅샷 · 미채택] 초기 스코어링 그리드 탐색의 Pareto 후보(g16).
# r20 재보정 이전 스코어링 축 실험 기록 보존용이며 운영 설정에 반영하지 않는다.

schema_version = "1.0"

[input]
min_width = 64
min_height = 64
min_std = 1.0

[roi]
mode = "auto"
dark_floor = 8
margin_px = 2
min_area_ratio = 0.2
close_kernel = 7
fixed_margin_px = 8

[preprocess]
median_kernel = 3
bg_kernel_ratio = 0.1
bg_kernel_min = 21
bg_kernel_max = 61
use_dark_channel = true
use_bright_channel = true
noise_floor_gray = 2.0

[candidates]
z_threshold = 4.0
min_contrast_gray = 12.0
open_kernel = 3
close_kernel = 5
merge_kernel = 7
min_area_px = 12
max_candidates = 20

[scoring]
ng_area_px = 2000.0
ng_contrast_gray = 24.0
ok_max = 0.75
ng_min = 1.0
multi_candidate_margin = 0.15

[quality]
blur_min_var = 20.0
dark_mean_min = 20.0
bright_mean_max = 235.0
saturated_ratio_max = 0.1

[decision]
border_touch_escalates = true
truncation_escalates = true
multi_candidate_escalates = true

[artifacts]
save_stages = false
overlay_scale = 2
