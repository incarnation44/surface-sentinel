<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>{% block title %}Surface Sentinel{% endblock %}</title>
<style>
:root {
  --ok: #15803d; --ok-bg: #f0fdf4; --ok-bd: #bbf7d0;
  --ng: #b91c1c; --ng-bg: #fef2f2; --ng-bd: #fecaca;
  --review: #a16207; --review-bg: #fffbeb; --review-bd: #fde68a;
  --error: #475569; --error-bg: #f8fafc; --error-bd: #cbd5e1;
  --navy: #0f172a; --navy-2: #1e293b; --navy-line: #334155;
  --line: #d5dce4; --line-soft: #e6ebf1;
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8fafc;
  --text: #0f172a; --muted: #475569; --link: #1d4ed8; --accent: #2563eb;
}
* { box-sizing: border-box; }
::selection { background: #bfdbfe; color: #0f172a; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body {
  margin: 0;
  font-family: "Pretendard Variable", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
  font-size: 14px;
}
header.topbar {
  background: var(--navy);
  color: #f8fafc;
  border-bottom: 1px solid var(--navy-2);
  padding: 0 20px;
}
.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand-wrap { display: flex; align-items: center; gap: 10px; }
.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #ffffff;
  font-weight: 700;
  text-decoration: none;
  font-size: 16px;
  letter-spacing: -0.01em;
}
.gnav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.gnav a {
  color: #cbd5e1;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 5px;
  border: 1px solid transparent;
}
.gnav a:hover { color: #ffffff; background: rgba(255, 255, 255, 0.08); }
.gnav a.active {
  color: #ffffff;
  background: var(--navy-2);
  border-color: var(--navy-line);
}
.mode-group { display: flex; align-items: center; gap: 6px; }
.mode-pill {
  font-size: 11px;
  font-weight: 600;
  color: #cbd5e1;
  background: var(--navy-2);
  border: 1px solid var(--navy-line);
  border-radius: 999px;
  padding: 2px 9px;
  white-space: nowrap;
}
.mode-pill.api-on { color: #bbf7d0; border-color: #166534; background: #052e16; }
main { max-width: 1280px; margin: 0 auto; padding: 20px; }
footer {
  max-width: 1280px;
  margin: 16px auto 0;
  padding: 12px 20px 20px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--line);
}
h1 { font-size: 21px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 700; margin: 22px 0 10px; color: var(--text); }
h3 { font-size: 14px; font-weight: 700; margin: 14px 0 6px; color: var(--text); }
a { color: var(--link); }
a:hover { text-decoration: underline; }
.num, table, .hash, code, kbd, .kpi-val { font-variant-numeric: tabular-nums; }
table {
  border-collapse: collapse;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
}
th, td {
  border: 1px solid var(--line-soft);
  padding: 7px 10px;
  text-align: left;
  font-size: 13px;
  vertical-align: top;
}
th { background: #f1f5f9; color: #334155; font-weight: 700; }
tbody tr:hover { background: #f8fafc; }
.table-wrap { overflow-x: auto; border-radius: 6px; }
.badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.02em;
}
.b-OK, .b-PASS, .b-NORMAL { background: var(--ok); }
.b-NG, .b-REJECT, .b-DRIFT_ALERT { background: var(--ng); }
.b-REVIEW, .b-REVISE, .b-WATCH { background: var(--review); }
.b-ERROR, .b-INSUFFICIENT_SAMPLE { background: var(--error); }
.badge-note { font-size: 12px; color: var(--muted); margin-left: 4px; }
.prio {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--line);
}
.p-P0 { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
.p-P1 { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
.p-P2 { background: #eff6ff; border-color: #93c5fd; color: #1e40af; }
.p-P3 { background: #f8fafc; border-color: #cbd5e1; color: #475569; }
.flag-pill {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-family: Consolas, monospace;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  color: #334155;
  margin: 1px 2px 1px 0;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
}
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 12px 0 16px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 14px;
}
.kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi-val { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 2px; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 12px; }
.grid .card { padding: 10px; }
.grid .card img { width: 100%; height: auto; display: block; border: 1px solid var(--line-soft); border-radius: 4px; }
.grid .noimg {
  width: 100%;
  aspect-ratio: 4 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef2f6;
  color: var(--muted);
  font-size: 12px;
  border: 1px solid var(--line-soft);
  border-radius: 4px;
}
.meta { font-size: 13px; color: var(--muted); word-break: break-all; }
.notice {
  background: var(--review-bg);
  border: 1px solid var(--review-bd);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 13px;
  color: #713f12;
}
.okbox {
  background: var(--ok-bg);
  border: 1px solid var(--ok-bd);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 13px;
  color: #14532d;
}
.errbox {
  background: var(--ng-bg);
  border: 1px solid var(--ng-bd);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 13px;
  color: #7f1d1d;
}
.arg-card {
  background: var(--surface);
  border: 1px solid #bfdbfe;
  border-radius: 6px;
  padding: 14px;
  margin: 14px 0;
}
.arg-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 10px;
}
.arg-steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}
.arg-step {
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: 5px;
  padding: 9px 11px;
}
.arg-step-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
.arg-step-body { font-size: 13px; color: var(--text); }
.images { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.images figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.images img { width: 100%; height: auto; border: 1px solid var(--line-soft); background: #fff; display: block; }
.images .noimg { width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: #eef2f6; color: var(--muted); font-size: 13px; border: 1px solid var(--line-soft); }
.images figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 600; }
.hash { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; word-break: break-all; }
form.decision {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
  margin-top: 16px;
}
form.decision label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px; }
form.decision select, form.decision input[type="text"], form.decision textarea,
.toolbar input[type="search"], .toolbar select {
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  font-size: 13px;
  font-family: inherit;
  background: #fff;
  color: var(--text);
}
form.decision .radios { display: flex; gap: 16px; flex-wrap: wrap; font-weight: 400; }
form.decision .radios label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 4px 0; }
button, .btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: #fff;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}
button:hover, .btn:hover { background: #1d4ed8; text-decoration: none; }
.btn-ghost {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: #f1f5f9; }
.btn-ghost.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}
.review-layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
.queue { list-style: none; margin: 0; padding: 0; }
.queue li { border: 1px solid var(--line); border-radius: 5px; margin-bottom: 6px; background: var(--surface); }
.queue li a { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 9px; text-decoration: none; color: var(--text); font-size: 12px; }
.queue li.current { outline: 2px solid var(--accent); background: #eff6ff; }
.keyhint { font-size: 13px; color: var(--muted); }
kbd { background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; padding: 0 5px; font-family: Consolas, monospace; font-size: 11px; }
.navlinks { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; font-size: 13px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
.stack-bar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: #e2e8f0; border: 1px solid var(--line-soft); }
.stack-seg { height: 100%; }
.bar-track { background: #e2e8f0; border-radius: 4px; height: 9px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--accent); }
.delta-good { color: var(--ok); font-weight: 700; }
.delta-bad { color: var(--ng); font-weight: 700; }
.delta-neutral { color: var(--muted); }
@media (max-width: 860px) {
  .review-layout { grid-template-columns: 1fr; }
  .topbar-inner { padding: 8px 0; }
  .kpi-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-wrap">
      <a class="brand" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="22" y2="12"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
        Surface Sentinel
      </a>
      <nav class="gnav" aria-label="전역 탐색">
        <a href="/" {% if current_path == "/" or current_path.startswith("/runs/") %}class="active"{% endif %}>Run 목록</a>
        <a href="/watchdog" {% if current_path.startswith("/watchdog") %}class="active"{% endif %}>Watchdog 관제</a>
        <a href="/inspections" {% if current_path.startswith("/inspections") %}class="active"{% endif %}>교차증거 DB</a>
        <a href="/stats" {% if current_path.startswith("/stats") %}class="active"{% endif %}>검사 통계</a>
        <a href="/compare" {% if current_path.startswith("/compare") %}class="active"{% endif %}>Run 비교</a>
      </nav>
    </div>
    <div class="mode-group">
      <span class="mode-pill">127.0.0.1 로컬 전용</span>
      {% if api_enabled %}
      <span class="mode-pill api-on">API 활성</span>
      {% endif %}
    </div>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Surface Sentinel {{ version }} · 광학 표면 계측 콘솔 · 읽기 전용 + REVIEW 검토 결정(append-only) · OK/NG 기계 판정은 불변</footer>
</body>
</html>
