# PR·push마다 Ubuntu/Windows에서 실행되는 기본 CI 워크플로우.
# 의존성 잠금, ruff 린트, 저장소 게이트, DB 트리거 검증, 비데이터/비브라우저 pytest를 점검한다.

name: ci

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run surface-sentinel gate
      - name: Verify records DB schema and append-only triggers
        run: |
          uv run surface-sentinel records init --db "${{ runner.temp }}/ci_records.db"
          uv run surface-sentinel records verify --db "${{ runner.temp }}/ci_records.db"
      - run: uv run pytest -m "not data and not browser"
