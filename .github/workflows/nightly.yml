name: nightly

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 KST
  workflow_dispatch:

jobs:
  nondata-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra yolo
      - run: uv run ruff check .
      - run: uv run pytest -m "not data"
