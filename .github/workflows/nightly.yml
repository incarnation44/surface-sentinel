name: nightly

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 KST
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  nondata-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra yolo
      - run: uv lock --check
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Install Playwright Chromium (non-Linux)
        if: runner.os != 'Linux'
        run: uv run playwright install chromium
      - run: uv run ruff check .
      - run: uv run surface-sentinel gate
      - name: Verify records DB schema and append-only triggers
        run: |
          uv run surface-sentinel records init --db "${{ runner.temp }}/nightly_records.db"
          uv run surface-sentinel records verify --db "${{ runner.temp }}/nightly_records.db"
      - run: uv run pytest -m "not data"
