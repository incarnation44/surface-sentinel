name: nightly

on:
  schedule:
    - cron: "0 18 * * *"   # 03:00 KST
  workflow_dispatch:

jobs:
  nondata-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra yolo
      - run: uv lock --check
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Install Playwright Chromium (non-Linux)
        if: runner.os != 'Linux'
        run: uv run playwright install chromium
      - run: uv run ruff check .
      - run: uv run surface-sentinel gate
      - name: Verify records DB schema and append-only triggers
        run: >
          uv run python -c "import pathlib, subprocess, sys, tempfile;
          d = tempfile.TemporaryDirectory();
          db = pathlib.Path(d.name) / 'records.db';
          subprocess.run([sys.executable, '-m', 'surface_sentinel', 'records', 'init', '--db', str(db)], check=True);
          subprocess.run([sys.executable, '-m', 'surface_sentinel', 'records', 'verify', '--db', str(db)], check=True);
          d.cleanup()"
      - run: uv run pytest -m "not data"
